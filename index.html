<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check the current weather in your city or any city in the world.">
    <meta name="theme-color" content="#083359">
    <title>MyWeather - Kevin Rojas - PWA</title>
    <link rel="icon" href="img/favicon.ico">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <header>
        <img src="img/logo.jpg" alt="MyWeather logo">
        <h1>MyWeather</h1>
    </header>

    <main>
        <form id="search_form" novalidate>
            <div class="search-box">
                <label for="search_input" class="visually-hidden">Search for a city</label>
                <input type="search" id="search_input" name="city" placeholder="Search for a city" autocomplete="off"
                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
                <ul id="suggestions" role="listbox" aria-label="City suggestions" hidden></ul>
            </div>
            <button id="search_button" type="submit">Search</button>
        </form>

        <button id="my_location" type="button" class="secondary-button">📍 Use my location</button>

        <p id="message" role="status" aria-live="polite"></p>

        <h2 id="location"></h2>

        <div id="current_weather">
            <p>Current weather</p>
            <img id="weather_icon" alt="" hidden>
            <p><span id="value_condition">--</span></p>
        </div>

        <div id="details">
            <div id="temp_max">
                <p>Max temperature</p>
                <p><span id="value_temp_max">--</span>°C</p>
            </div>

            <div id="temp_min">
                <p>Min temperature</p>
                <p><span id="value_temp_min">--</span>°C</p>
            </div>

            <div id="humidity">
                <p>Humidity</p>
                <p><span id="value_humidity">--</span>%</p>
            </div>

            <div id="feels_like">
                <p>Feels like</p>
                <p><span id="value_feels_like">--</span>°C</p>
            </div>

            <div id="pressure">
                <p>Atmospheric pressure</p>
                <p><span id="value_pressure">--</span>hPa</p>
            </div>

            <div id="wind_speed">
                <p>Wind speed</p>
                <p><span id="value_wind_speed">--</span>km/h</p>
            </div>
        </div>
    </main>

    <script src="script_ppl.js?v=4"></script>
</body>
</html>
